<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Градієнт для фону -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Градієнт для сонця -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Маска для обрізання пейзажу всередині лінзи -->
    <clipPath id="lens-clip">
      <circle cx="28" cy="28" r="14" />
    </clipPath>
  </defs>

  <!-- Фон: синій закруглений квадрат -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg-grad)" />

  <!-- Гірський пейзаж всередині лупи -->
  <g clip-path="url(#lens-clip)">
    <!-- Небо (всередині лінзи) -->
    <rect x="12" y="12" width="32" height="32" fill="#60A5FA" />
    
    <!-- Сонце -->
    <circle cx="34" cy="21" r="3.5" fill="url(#sun-grad)" />

    <!-- Задня гора -->
    <polygon points="14,35 25,22 36,35" fill="#93C5FD" />

    <!-- Передня гора -->
    <polygon points="20,38 31,24 43,38" fill="#FFFFFF" />
  </g>

  <!-- Контур та ручка лупи -->
  <!-- Обідок лінзи -->
  <circle cx="28" cy="28" r="14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

  <!-- Ручка лупи -->
  <path d="M38 38 L50 50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
</svg>
